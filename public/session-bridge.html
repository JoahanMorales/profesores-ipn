<!DOCTYPE html>
<html>
<head><title>IPNProfes Session Bridge</title></head>
<body>
<script>
  /**
   * Puente de sesión entre ipnprofes.com y la extensión del navegador.
   * 
   * La extensión carga esta página en un iframe oculto desde el SAES,
   * envía un postMessage pidiendo la sesión, y esta página responde
   * con los datos del usuario desde localStorage (solo datos no sensibles).
   */
  window.addEventListener('message', function(event) {
    // Solo responder a peticiones de sesión
    if (!event.data || event.data.type !== 'IPN_GET_SESSION') return;

    try {
      var raw = localStorage.getItem('ipn_user');
      var user = raw ? JSON.parse(raw) : null;

      // Solo devolver datos seguros (sin canción favorita ni fingerprint)
      var safeUser = user ? {
        id: user.id,
        username: user.username,
        monedas: user.monedas || 0,
        totalEvaluaciones: user.totalEvaluaciones || 0
      } : null;

      event.source.postMessage({
        type: 'IPN_SESSION_RESPONSE',
        user: safeUser
      }, event.origin);
    } catch (e) {
      event.source.postMessage({
        type: 'IPN_SESSION_RESPONSE',
        user: null
      }, event.origin);
    }
  });
</script>
</body>
</html>
